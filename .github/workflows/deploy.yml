name: Construir y publicar el libro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar Jupyter Book
        run: python -m pip install "jupyter-book==1.0.4.post1"

      - name: Construir el libro
        run: jupyter-book build .

      - name: Publicar los archivos HTML en la rama book-site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: book-site
          publish_dir: _build/html
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
